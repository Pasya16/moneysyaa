<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moneysyaa - Personal Finance</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Moneysyaa</h1>
      <p>Catatan Alokasi GoPay & Tabungan BNI</p>
    </header>

    <!-- Cards Ringkasan Saldo -->
    <section class="cards-grid">
      <div class="card card-gopay">
        <span class="card-tag">Uang Harian</span>
        <h3>Saldo GoPay</h3>
        <p class="balance" id="saldo-gopay">Rp 0</p>
      </div>
      <div class="card card-bni">
        <span class="card-tag">Brankas Tabungan</span>
        <h3>Tabungan BNI</h3>
        <p class="balance" id="saldo-bni">Rp 0</p>
      </div>
      <div class="card card-total">
        <span class="card-tag">Total Aset</span>
        <h3>Total Kekayaan</h3>
        <p class="balance" id="saldo-total">Rp 0</p>
      </div>
    </section>

    <!-- Form Input Transaksi Dinamis -->
    <section class="form-section">
      <div class="section-title">
        <h2>Tambah Transaksi</h2>
        <span class="subtitle-mode" id="mode-indicator">Mode: Pengeluaran</span>
      </div>
      
      <form id="finance-form">
        <div class="form-group form-highlight">
          <label for="tipe">Pilih Jenis Transaksi</label>
          <select id="tipe" required>
            <option value="pengeluaran">Pengeluaran (Bayar / Jajan)</option>
            <option value="pemasukan">Pemasukan (Top-Up / Transfer Masuk)</option>
            <option value="tabung">Nabung (Transfer GoPay ke BNI)</option>
          </select>
        </div>

        <div class="form-group expand-field" id="group-nominal">
          <label for="nominal">Nominal (Rp)</label>
          <input type="text" id="nominal" placeholder="Contoh: 50.000" inputmode="numeric" required>
        </div>

        <div class="form-group expand-field" id="group-tujuan">
          <label for="tujuan">Metode / Media Penerima</label>
          <select id="tujuan">
            <option value="QRIS / Merchant">QRIS / Merchant (Toko/Kantin)</option>
            <option value="E-Wallet">E-Wallet (OVO/ShopeePay/DANA)</option>
            <option value="Bank BNI">Bank BNI</option>
            <option value="Bank Lain">Bank Lain (BCA/Mandiri/BRI)</option>
            <option value="Cash / Cashout">Tarik Tunai / Cash</option>
          </select>
        </div>

        <div class="form-group expand-field" id="group-keterangan">
          <label for="keterangan" id="label-keterangan">Nama Penerima / Catatan</label>
          <input type="text" id="keterangan" placeholder="Contoh: Makan siang, Beli Kuota, dll" required>
        </div>

        <button type="submit" class="btn-primary" id="btn-submit">Simpan Transaksi</button>
      </form>
    </section>

    <!-- Riwayat Transaksi -->
    <section class="history-section">
      <div class="history-header">
        <h2>Riwayat Transaksi</h2>
        <button id="btn-pdf" class="btn-pdf">Export PDF</button>
      </div>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Tanggal</th>
              <th>Tipe</th>
              <th>Penerima / Media</th>
              <th>Keterangan</th>
              <th>Nominal</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="transaction-list">
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
